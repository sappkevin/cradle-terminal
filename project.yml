name: Cradle
options:
  bundleIdPrefix: com.cradleterm
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: Cradle
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.cradleterm.app

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: "1.0.0"

targets:
  Cradle:
    type: application
    platform: macOS
    sources:
      - path: Cradle
        excludes:
          - "Resources/shell-integration/**"
      - path: Cradle/Resources/shell-integration
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Cradle/Info.plist
        CODE_SIGN_ENTITLEMENTS: Cradle/Cradle.entitlements
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - package: SwiftTerm
    entitlements:
      path: Cradle/Cradle.entitlements
