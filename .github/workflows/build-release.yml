name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  TEAM_ID: H5A65VHQU7
  BUNDLE_ID: com.cradleterm.app

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install XcodeGen + create-dmg
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -e
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          echo "$CERT_P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 \
            -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Make our keychain the only one in the search list so codesign
          # can find the identity without interactive unlock prompts.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm $RUNNER_TEMP/cert.p12

      - name: Build (signed + hardened)
        run: |
          xcodebuild build \
            -project Cradle.xcodeproj \
            -scheme Cradle \
            -configuration Release \
            -derivedDataPath build \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime"

      - name: Verify signing
        run: |
          codesign -dv --verbose=4 build/Build/Products/Release/Cradle.app
          codesign --verify --deep --strict --verbose=2 build/Build/Products/Release/Cradle.app

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -e
          ditto -c -k --keepParent \
            "build/Build/Products/Release/Cradle.app" \
            "$RUNNER_TEMP/Cradle.zip"

          # Submit and capture the submission ID so we can always print the log.
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$RUNNER_TEMP/Cradle.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait \
            --output-format json) || SUBMIT_FAILED=1
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | python3 -c "import sys, json; print(json.loads(sys.stdin.read()).get('id',''))" 2>/dev/null || echo "")

          if [ -n "$SUBMISSION_ID" ]; then
            echo "===== Notarization log ====="
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$TEAM_ID" || true
          fi

          if [ -n "${SUBMIT_FAILED:-}" ]; then
            exit 1
          fi

          STATUS=$(echo "$SUBMIT_OUTPUT" | python3 -c "import sys, json; print(json.loads(sys.stdin.read()).get('status',''))" 2>/dev/null || echo "")
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization status: $STATUS"
            exit 1
          fi

          xcrun stapler staple "build/Build/Products/Release/Cradle.app"

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Cradle" \
            --window-size 600 400 \
            --icon "Cradle.app" 150 190 \
            --app-drop-link 450 190 \
            "Cradle.dmg" \
            "build/Build/Products/Release/Cradle.app"

      - name: Staple DMG
        run: xcrun stapler staple Cradle.dmg

      - name: Verify Gatekeeper acceptance
        run: spctl -a -vv -t open --context context:primary-signature Cradle.dmg || spctl -a -vv Cradle.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cradle.dmg
          path: Cradle.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Cradle.dmg
          generate_release_notes: true
